<!DOCTYPE html>
<html>
    <head>
        <title>Edit Tweet</title>
        <link type="text/css" href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet"/>
        <script type="module" src="{{ url_for('static', path='/firebase-login.js') }}"></script>
    </head>
    <body>
        <nav>
            <a href="/"><strong>🐦 Twitter Clone</strong></a>
            <div>
                {% if user_token %}
                <a href="/timeline">Timeline</a>
                <a href="/search">Search</a>
                <a href="/profile/{{ user_info['username'] }}">My Profile</a>
                {% endif %}
                <button id="sign-out" hidden="true" class="btn">Sign Out</button>
            </div>
        </nav>

        <div class="container">
            <h2>Edit Tweet</h2>

            {% if error_message %}
            <p class="error">{{ error_message }}</p>
            {% endif %}

            <form action="/edit-tweet/{{ tweet['_id'] }}" method="post" 
            enctype="multipart/form-data">
                <div class="tweet-box">
                    <textarea name="content" maxlength="280" rows="3">{{ tweet['content'] }}</textarea>
                    <br/>
                    {% if tweet['image'] %}
                    <p>Current image:</p>
                    <img src="{{ tweet['image'] }}" style="max-width:200px"/>
                    <br/>
                    {% endif %}
                    <p>Change image (JPG/PNG only):</p>
                    <input type="file" name="tweet_image" accept=".jpg,.jpeg,.png"/>
                    <br/><br/>
                    <input type="submit" value="Save Changes" class="btn"/>
                    <a href="/"><button type="button" class="btn">Cancel</button></a>
                </div>
            </form>
        </div>
    </body>
</html>
